name: Build and deploy frontend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/shikhajohnnette/apar-frontend:${{ github.sha }}
            ghcr.io/shikhajohnnette/apar-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://148.135.138.144:8080' }}

      - name: Configure SSH
        if: github.event_name == 'push'
        env:
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keygen -y -P "" -f ~/.ssh/hostinger_deploy > /dev/null
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload Compose configuration
        if: github.event_name == 'push'
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_APP_DIR: ${{ secrets.HOSTINGER_APP_DIR }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/hostinger_deploy -p "${HOSTINGER_SSH_PORT:-22}" "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "mkdir -p '$HOSTINGER_APP_DIR' && cat > '$HOSTINGER_APP_DIR/compose.frontend.yaml'" < compose.yaml

      - name: Deploy image on Hostinger
        if: github.event_name == 'push'
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_APP_DIR: ${{ secrets.HOSTINGER_APP_DIR }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/hostinger_deploy -p "${HOSTINGER_SSH_PORT:-22}" "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "cd '$HOSTINGER_APP_DIR' && IMAGE_TAG='$GITHUB_SHA' docker compose -p apar -f compose.frontend.yaml pull frontend && IMAGE_TAG='$GITHUB_SHA' docker compose -p apar -f compose.frontend.yaml up -d --no-build frontend && docker compose -p apar -f compose.frontend.yaml ps frontend"